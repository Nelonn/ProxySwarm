[package]
name = "manager"
version = "0.1.0"
edition = "2021"

[features]
desktop = []

[dependencies]
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"
yew-hooks = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Document", "Element", "EventTarget", "File", "FileList", "FileReader", "HtmlAnchorElement", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Location", "ProgressEvent", "Storage", "Url", "Window"] }
prost = "0.14.3"
gloo-storage = "0.4.0"
gloo-net = "0.7.0"
gloo-timers = "0.3.0"
uuid = { version = "1.0", features = ["v4", "js"] }
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
qrcodegen = "1.8.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
getrandom = { version = "0.2", features = ["js"] }
sha2 = "0.10"
trusttunnel-deeplink = { git = "https://github.com/TrustTunnel/TrustTunnel/" }

# For gRPC-Web in WASM, we use gloo-net for HTTP requests instead of tonic
# gRPC-Web calls will be made via Fetch API

[build-dependencies]
prost-build = "0.14"
